<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Clock</title>
    <link
      rel="icon"
      type="image/png"
      href="/public/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="shortcut icon" href="/public/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/public/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/public/site.webmanifest" />

    <script
      src="https://kit.fontawesome.com/c0bfbb1e13.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="clock-container">
      <div id="clock-title">
        <a
          href="https://github.com/jalensailin/binary-clock-js"
          target="_blank"
        >
          <i class="fa-brands fa-github"></i>
        </a>
        <h1>Binary Clock</h1>
      </div>
      <time id="binary-clock" datetime="">
        <clock-hours>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>

          <pip class="meridiem" style="display: none"></pip>

          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
        </clock-hours>

        <clock-minutes>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
        </clock-minutes>

        <clock-seconds>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
        </clock-seconds>
      </time>

      <time id="decimal-clock" datetime="">
        <clock-hours>
          <span>
            Hours:
            <span></span>
          </span>
        </clock-hours>

        <clock-minutes>
          <span>
            Minutes:
            <span></span>
          </span>
        </clock-minutes>

        <clock-seconds>
          <span>
            Seconds:
            <span></span>
          </span>
        </clock-seconds>
      </time>

      <button id="toggle-config">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>
      <div class="form-wrapper">
        <form autocomplete="off">
          <h2>Settings</h2>
          <form-group>
            <label for="show-place-values">Show place values</label>
            <div class="checkbox-wrapper">
              <input
                type="checkbox"
                id="show-place-values"
                name="show-place-values"
              />
            </div>
          </form-group>
          <form-group>
            <label for="twelve-hour-time">12-hour time</label>
            <div class="checkbox-wrapper">
              <input
                type="checkbox"
                id="twelve-hour-time"
                name="twelve-hour-time"
              />
            </div>
          </form-group>
          <form-group>
            <label for="hide-unused-pips">Hide unused pips</label>
            <div class="checkbox-wrapper">
              <input
                type="checkbox"
                id="hide-unused-pips"
                name="hide-unused-pips"
              />
            </div>
          </form-group>

          <form-group>
            <label for="hide-decimal-time">Hide decimal time</label>
            <div class="checkbox-wrapper">
              <input
                type="checkbox"
                id="hide-decimal-time"
                name="hide-decimal-time"
              />
            </div>
          </form-group>

          <form-group>
            <label for="hide-title">Hide title</label>
            <div class="checkbox-wrapper">
              <input type="checkbox" id="hide-title" name="hide-title" />
            </div>
          </form-group>
        </form>
      </div>
    </div>

    <footer>
      <p>
        Created by
        <a href="https://github.com/jalensailin" target="_blank"
          >J▲len Michals Levy</a
        >. Circa 2026.
      </p>
    </footer>

    <script type="module" src="index.js"></script>
  </body>
</html>
