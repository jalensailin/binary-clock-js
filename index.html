<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Clock</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <binary-clock id="clock">
      <clock-hours>
        <time class="binary-time">
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip class="meridiem" style="display: none"></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
        </time>
        <time class="decimal-time">Hours:&nbsp;<span></span></time>
      </clock-hours>
      <clock-minutes>
        <time class="binary-time">
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
        </time>
        <time class="decimal-time">Minutes:&nbsp;<span></span></time>
      </clock-minutes>
      <clock-seconds>
        <time class="binary-time">
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
        </time>
        <time class="decimal-time">Seconds:&nbsp;<span></span></time>
      </clock-seconds>
    </binary-clock>
    <script type="module" src="index.js"></script>
  </body>
</html>
