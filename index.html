<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Clock</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="binary-clock-container">
      <binary-clock id="clock">
        <clock-hours>
          <pip>128</pip>
          <pip>64</pip>
          <pip>32</pip>
          <pip>16</pip>
          <pip>8</pip>
          <pip>4</pip>
          <pip>2</pip>
          <pip>1</pip>
        </clock-hours>
        <clock-minutes>
          <pip>128</pip>
          <pip>64</pip>
          <pip>32</pip>
          <pip>16</pip>
          <pip>8</pip>
          <pip>4</pip>
          <pip>2</pip>
          <pip>1</pip>
        </clock-minutes>
        <clock-seconds>
          <pip>128</pip>
          <pip>64</pip>
          <pip>32</pip>
          <pip>16</pip>
          <pip>8</pip>
          <pip>4</pip>
          <pip>2</pip>
          <pip>1</pip>
        </clock-seconds>
      </binary-clock>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
