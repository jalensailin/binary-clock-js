<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Clock</title>
    <link rel="stylesheet" href="dist/index.css" />
  </head>
  <body>
    <binary-clock id="clock">
      <clock-hours>
        <time class="binary-time">
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip class="meridiem" style="display: none"></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
        </time>
        <time class="decimal-time">Hours:<span></span></time>
      </clock-hours>
      <clock-minutes>
        <time class="binary-time">
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
        </time>
        <time class="decimal-time">Minutes:<span></span></time>
      </clock-minutes>
      <clock-seconds>
        <time class="binary-time">
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
          <pip></pip>
        </time>
        <time class="decimal-time">Seconds:<span></span></time>
      </clock-seconds>

      <button id="toggle-config">
        <label for="toggle-config">Toggle</label>
      </button>
      <form>
        <div class="form-group">
          <label for="show-place-values">Show place values</label>
          <input type="checkbox" id="show-place-values" />
        </div>

        <div class="form-group">
          <label for="twelve-hour-time">12-hour time</label>
          <input type="checkbox" id="twelve-hour-time" />
        </div>

        <div class="form-group">
          <label for="hide-unused-pips">Hide unused pips</label>
          <input type="checkbox" id="hide-unused-pips" />
        </div>
      </form>
    </binary-clock>

    <script type="module" src="index.js"></script>
  </body>
</html>
